<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>山の雑学クイズ - 山の知識を深めて頂上を目指そう！</title>
    <link rel="icon" type="image/png" href="../images/pechi.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Honk:MORF,SHLN@14,35.7&family=Kiwi+Maru&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/mountain_bg.css" />
    <!-- <link rel="stylesheet" href="../css/background_move.css" /> -->
    <link rel="stylesheet" href="../css/quiz_mountain_style.css" />
    <!-- <link rel="stylesheet" href="../css/style.css" /> -->
  </head>
  <body>
    <canvas id="mountain-bg" aria-label="山と雲がスクロールする背景"></canvas>
    <header>
      <div class="header">
        <h1>🏔️ 山の雑学クイズすごろく 🏔️</h1>
        <p>山の知識を深めて頂上を目指そう！</p>
      </div>
    </header>

    <div class="container">
      <div class="game-area">
        <div class="info-panel">
          <div class="info-card">
            <div class="label">現在地</div>
            <div class="value" id="current-position">0</div>
          </div>
          <div class="info-card">
            <div class="label">ターン数</div>
            <div class="value" id="turn-count">0</div>
          </div>
          <div class="info-card">
            <div class="label">クイズ正解数</div>
            <div class="value"><span id="quiz-count">0</span></div>
          </div>
        </div>

        <div id="message-area"></div>

        <div class="board-wrapper">
          <div class="board" id="board">
            <svg
              id="board-lines"
              style="
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 0;
              "
            ></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- クイズモーダル -->
    <div
      class="modal"
      id="quizModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="quizModalTitle"
    >
      <div class="modal-content">
        <div class="modal-icon" aria-hidden="true">🏔️</div>
        <div class="modal-title" id="quizModalTitle">山の雑学クイズ</div>
        <div class="quiz-question" id="quizQuestion"></div>
        <div class="quiz-options" id="quizOptions"></div>
      </div>
    </div>

    <!-- イベントモーダル -->
    <div class="modal" id="eventModal">
      <div class="modal-content">
        <div class="modal-icon" id="eventIcon"></div>
        <div class="modal-title" id="eventTitle"></div>
        <div class="modal-message" id="eventMessage"></div>
        <button class="btn btn-primary" onclick="closeEventModal()">OK</button>
      </div>
    </div>

    <!-- ゴールモーダル -->
    <div class="modal" id="goalModal">
      <div class="modal-content">
        <div class="modal-icon">🎉</div>
        <div class="modal-title">頂上到達！</div>
        <div class="modal-message" id="goalMessage"></div>
        <div
          style="
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
          "
        >
          <button class="btn btn-primary" onclick="showResult()">
            結果を見る
          </button>
          <button class="btn btn-secondary" onclick="resetGame()">
            もう一度遊ぶ
          </button>
        </div>
      </div>
    </div>

    <!-- ダイスモーダル -->
    <div
      class="modal"
      id="diceModal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="diceModalTitle"
    >
      <div class="modal-content dice-modal-content" tabindex="-1">
        <h2
          id="diceModalTitle"
          style="
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
          "
        >
          何が出るかな？
        </h2>
        <div class="dice-container">
          <div class="dice" id="dice">
            <div class="dice-face face-1"><div class="dot"></div></div>
            <div class="dice-face face-2">
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
            <div class="dice-face face-3">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
            <div class="dice-face face-4">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
            <div class="dice-face face-5">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
            <div class="dice-face face-6">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="dice-section">
      <button class="btn btn-primary" id="rollBtn" type="button">
        サイコロを振る
      </button>
    </div>

    <!-- ホームに戻るボタン -->
    <div
      class="button-container"
      style="text-align: center; margin: 40px 0; padding-bottom: 100px"
    >
      <button class="choice-button" onclick="location.href = '../index.html'">
        ホームへ戻る
      </button>
      <button
        class="choice-button"
        onclick="location.href = 'stage_select.html'"
      >
        ステージ選択へ
      </button>
    </div>

    <footer></footer>
    <script src="../js/quiz_mountain_script.js"></script>
    <script src="../js/mountain_bg.js"></script>
  </body>
</html>
