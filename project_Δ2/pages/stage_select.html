    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Honk:MORF,SHLN@14,35.7&family=Kiwi+Maru&display=swap"

    <link rel="stylesheet" href="../css/reset.css" />

    <style>
      .stage-main-container {
        max-width: 800px;
        margin: 100px auto 60px;
        padding: 20px;
        position: relative;
        z-index: 1;
      }

      .stage-title {
        font-size: clamp(2.5rem, 5vw, 4rem);
        color: #fcff4c;
        text-shadow:
          0 0 30px rgba(252, 255, 76, 1),
          0 6px 20px rgba(0, 0, 0, 0.8);
        text-align: center;
        margin-bottom: 80px;
        font-family: "Kiwi Maru", serif;
      }

      .stage-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 40px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .stage-card {
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.2) 0%,
          rgba(118, 75, 162, 0.2) 100%
        );
        backdrop-filter: blur(15px);
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 25px;
        padding: 40px 30px;
        text-align: center;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }

      .stage-card::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(252, 255, 76, 0.2);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }

      .stage-card:hover:not(.stage-disabled)::before {
        width: 500px;
        height: 500px;
      }

      .stage-card:hover:not(.stage-disabled) {
        transform: translateY(-15px) scale(1.03);
        box-shadow: 0 20px 50px rgba(102, 126, 234, 0.5);
        border-color: rgba(252, 255, 76, 0.7);
      }

      .stage-card.stage-disabled {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(0.5);
      }

      .stage-icon {
        font-size: 5rem;
        margin-bottom: 25px;
        position: relative;
        z-index: 1;
        animation: iconFloat 3s ease-in-out infinite;
      }

      @keyframes iconFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .stage-name {
        font-size: 1.8rem;
        font-weight: bold;
        color: white;
        margin-bottom: 15px;
        font-family: "Kiwi Maru", serif;
        position: relative;
        z-index: 1;
      }

      .stage-description {
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.8;
        font-family: "Kiwi Maru", serif;
        position: relative;
        z-index: 1;
      }

      .stage-badge {
        display: inline-block;
        padding: 8px 20px;
        background: rgba(252, 255, 76, 0.3);
        color: #fcff4c;
        border-radius: 20px;
        font-size: 0.95rem;
        font-weight: bold;
        margin-top: 20px;
        font-family: "Kiwi Maru", serif;
        position: relative;
        z-index: 1;
      }

      .back-button {
        position: fixed;
        bottom: 40px;
        left: 40px;
        padding: 15px 40px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: 3px solid rgba(255, 255, 255, 0.4);
        border-radius: 40px;
        cursor: pointer;
        font-size: 1.1rem;
        font-family: "Kiwi Maru", serif;
        font-weight: bold;
        transition: all 0.3s ease;
        z-index: 100;
        backdrop-filter: blur(10px);
      }

      .back-button:hover {
        background: rgba(0, 0, 0, 0.9);
        border-color: rgba(252, 255, 76, 0.9);
        transform: translateX(-8px);
      }

      @media (max-width: 768px) {
        .stage-main-container {
          margin-top: 120px;
        }

        .stage-grid {
          grid-template-columns: 1fr;
          gap: 25px;
        }

        .back-button {
          bottom: 25px;
          left: 25px;
          padding: 12px 30px;
          font-size: 1rem;
        }
      }
    </style>
  </head>

    <main class="stage-main-container">
      <h1 class="stage-title">ステージを選択してね！</h1>

      <div class="stage-grid">
        <!-- コードすごろく -->
        <div class="stage-card" id="stageCode">
          <div class="stage-icon">💻</div>
          <h2 class="stage-name">コードすごろく</h2>
          <p class="stage-description">
            プログラミングの知識を<br />

    <button class="back-button" onclick="history.back()">← 戻る</button>

    <script>
      // コードすごろくステージカードのクリック処理
      document
        .getElementById("stageCode")
        .addEventListener("click", function () {
          // localStorageから遊び方を取得
          const playMode = localStorage.getItem("playMode") || "solo";

          if (playMode === "solo") {
            location.href = "sugoroku_origin.html";
          } else {
            location.href = "sugoroku_members_play.html?stage=1";
          }
        });

      // 山の雑学クイズステージカードのクリック処理
      document
        .getElementById("stageMountain")
        .addEventListener("click", function () {
          // localStorageから遊び方を取得
          const playMode = localStorage.getItem("playMode") || "solo";

          if (playMode === "solo") {
            location.href = "quiz_mountain.html";
          } else {
            location.href = "quiz_mountain_members.html?stage=2";
          }
        });

      // ウルトラマンクイズステージカードのクリック処理
      document
        .getElementById("stageUltraman")
        .addEventListener("click", function () {
          // localStorageから遊び方を取得
          const playMode = localStorage.getItem("playMode") || "solo";

          if (playMode === "solo") {
            location.href = "sugoroku_ultlaman.html";
          } else {
            location.href = "sugoroku_ultraman_member.html?stage=3";
          }
        });

      // ワールドステージカードのクリック処理
      document
        .getElementById("stageWorld")
        .addEventListener("click", function () {
          // localStorageから遊び方を取得
          const playMode = localStorage.getItem("playMode") || "solo";

          if (playMode === "solo") {
            location.href = "world_origin.html";
          } else {
            location.href = "world_members.html?stage=4";
          }
        });
    </script>
