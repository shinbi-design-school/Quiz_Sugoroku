<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双六ゲーム - プレイ人数選択</title>
    <link rel="icon" type="image/png" href="images/pechi.png">
    <link rel="stylesheet" href="css/background_move.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="fiber"></canvas>
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-content">
        <div class="header-left">
          <span class="header-title">
            <a href="index.html">
              <img class="header-img" src="images/takibi_logo.png" alt="" />
            </a>
          </span>
        </div>

        <!-- ハンバーガーメニューボタン -->
        <button class="hamburger" id="hamburger" aria-label="メニュー">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </header>

    <!-- ハンバーガーメニュー（オーバーレイ） -->
    <nav class="menu-overlay" id="menuOverlay">
      <div class="menu-content">
        <button class="menu-close" id="menuClose" aria-label="閉じる">
          &times;
        </button>
        <ul class="menu-list">
          <li><a href="index.html" class="menu-item">ホーム</a></li>
          <li><a href="site_howtouse.html" class="menu-item">遊び方</a></li>
          <li><a href="team.html" class="menu-item">作成者</a></li>
        </ul>
      </div>
    </nav>

    <!-- メインコンテンツ -->
    <main class="main-container">
      <h1>⚀ コードの帆を上げろQUIZ ⚀</h1>
      <div class="title-area">
        <p>コードの知識を発揮してゴールを目指そう!</p>
      </div>

      <!-- 選択カード -->
      <div class="choice-card">
        <div
          class="button-container"
          style="
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
          "
        >
          <button class="choice-button solo-button" data-mode="solo">
            ひとりであそぶ
          </button>
          <button
            class="choice-button multi-button"
            data-mode="multi"
            onclick="location.href = 'members_select.html'"
          >
            みんなであそぶ
          </button>
        </div>
      </div>
    </main>
    <script src="js/script.js"></script>
    <script src="js/background_move.js"></script>
  </body>
</html>
