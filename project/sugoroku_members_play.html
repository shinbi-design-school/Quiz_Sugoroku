<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>みんなですごろく</title>
    <link rel="stylesheet" href="css/background_move.css" />
    <link rel="stylesheet" href="css/sugoroku_origin_style.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* ========== 現在プレイヤーバナー ========== */
      #currentPlayerBanner {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 12px 24px;
        background: rgba(34, 23, 59, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 3px solid #fcff4c;
        font-size: 1.2rem; font-weight: bold; color: #fff;
      }
      #currentPlayerBanner .banner-avatar {
        width: 36px; height: 36px;
      }
      #currentPlayerBanner .banner-name {
        font-size: 1.4rem; font-weight: bold;
      }
      #currentPlayerBanner .banner-label {
        font-size: 0.95rem; color: rgba(255,255,255,0.7);
      }
      #currentPlayerBanner .banner-turn {
        font-size: 1rem; color: #fcff4c;
        margin-left: 8px;
      }

      /* ヘッダーにバナー分の余白 */
      header { margin-top: 64px; }

      /* ========== プレイヤーリスト（固定サイドバー風）========== */
      #playersList {
        position: fixed;
        top: 120px; left: 10px;
        z-index: 1500;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .player-status-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 30px;
        background: rgba(34,23,59,0.75);
        border: 2px solid rgba(255,255,255,0.2);
        color: #fff;
        font-size: 0.85rem;
        transition: all 0.3s;
        backdrop-filter: blur(4px);
      }
      .player-status-badge.current {
        border-color: #fcff4c;
        background: rgba(34,23,59,0.95);
        transform: scale(1.06);
      }
      .player-status-badge.finished {
        opacity: 0.55;
      }
      .badge-pin {
        width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.5);
        flex-shrink: 0;
      }
      .badge-pos { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
      .badge-goal { font-size: 0.75rem; color: #fcff4c; margin-left: 2px; }

      /* ========== ターン切り替えオーバーレイ ========== */
      #turnOverlay {
        display: none;
        position: fixed; inset: 0; z-index: 3000;
        background: rgba(0,0,0,0.82);
        align-items: center; justify-content: center;
        flex-direction: column; gap: 24px;
      }
      #turnOverlay.show { display: flex; }
      #turnOverlay .ov-title {
        font-size: 1.2rem; color: rgba(255,255,255,0.7); font-weight: bold;
      }
      #turnOverlay .ov-name {
        font-size: 2.8rem; font-weight: bold;
        text-shadow: 0 0 20px rgba(252,255,76,0.8);
      }
      #turnOverlay svg { filter: drop-shadow(0 0 12px rgba(252,255,76,0.6)); }
      #turnOverlay .ov-sub {
        font-size: 1rem; color: rgba(255,255,255,0.6);
      }
      #btnTurnStart {
        padding: 14px 48px; font-size: 1.2rem; font-weight: bold;
        border-radius: 50px; border: none;
        background: #fcff4c; color: #22173b;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(252,255,76,0.5);
        transition: all 0.2s;
        margin-top: 8px;
      }
      #btnTurnStart:hover { transform: translateY(-3px); }
    </style>
  </head>
  <body>
    <canvas id="fiber"></canvas>

    <!-- ターン切り替えオーバーレイ -->
    <div id="turnOverlay">
      <p class="ov-title" id="ovTitle">つぎのプレイヤー</p>
      <svg id="ovAvatar" width="100" height="115" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
        <path id="ovAvatarBody" d="M 60 140 L 40 120 L 35 120 L 45 80 A 40 40 0 1 1 75 80 L 85 120 L 80 120 Z" fill="#00BFFF"/>
        <circle cx="50" cy="45" r="12" fill="white" opacity="0.3"/>
      </svg>
      <p class="ov-name" id="ovName">プレイヤー</p>
      <p class="ov-sub" id="ovSubText">の番です！</p>
      <button id="btnTurnStart">スタート！</button>
    </div>

    <!-- 現在プレイヤーバナー -->
    <div id="currentPlayerBanner">
      <svg class="banner-avatar" id="bannerAvatar" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
        <path id="bannerAvatarBody" d="M 60 140 L 40 120 L 35 120 L 45 80 A 40 40 0 1 1 75 80 L 85 120 L 80 120 Z" fill="#00BFFF"/>
      </svg>
      <span class="banner-label">プレイヤー：</span>
      <span class="banner-name" id="bannerName">---</span>
      <span class="banner-turn" id="bannerTurnInfo"></span>
    </div>

    <!-- プレイヤーリスト -->
    <div id="playersList"></div>

    <header>
      <div class="header">
        <h1>⚀ コードの帆を上げろQUIZ ⚀</h1>
        <p>コードの知識を発揮してゴールを目指そう！</p>
      </div>
    </header>

    <div class="container">
      <div class="game-area">
        <div class="info-panel">
          <div class="info-card">
            <div class="label">現在地</div>
            <div class="value" id="current-position">0</div>
          </div>
          <div class="info-card">
            <div class="label">ターン数</div>
            <div class="value" id="turn-count">0</div>
          </div>
          <div class="info-card">
            <div class="label">クイズ正解数</div>
            <div class="value"><span id="quiz-count">0</span></div>
          </div>
        </div>
        <div id="message-area"></div>
        <div class="board-wrapper">
          <div class="board" id="board">
            <svg id="board-lines" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- クイズモーダル -->
    <div class="modal" id="quizModal" role="dialog" aria-modal="true" aria-labelledby="quizModalTitle">
      <div class="modal-content">
        <div class="modal-icon" aria-hidden="true">❓</div>
        <div class="modal-title" id="quizModalTitle">コードクイズ</div>
        <div class="quiz-question" id="quizQuestion"></div>
        <div class="quiz-options" id="quizOptions"></div>
      </div>
    </div>

    <!-- イベントモーダル -->
    <div class="modal" id="eventModal">
      <div class="modal-content">
        <div class="modal-icon" id="eventIcon"></div>
        <div class="modal-title" id="eventTitle"></div>
        <div class="modal-message" id="eventMessage"></div>
        <button class="btn btn-primary" onclick="closeEventModal()">OK</button>
      </div>
    </div>

    <!-- ゴールモーダル（1人ゴール時） -->
    <div class="modal" id="goalModal">
      <div class="modal-content">
        <div class="modal-icon">🎉</div>
        <div class="modal-title">ゴール達成！</div>
        <div class="modal-message" id="goalMessage"></div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;">
          <button class="btn btn-primary" id="btnAfterGoal" onclick="afterPlayerGoal()">次のプレイヤーへ</button>
        </div>
      </div>
    </div>

    <!-- 全員終了モーダル -->
    <div class="modal" id="allDoneModal">
      <div class="modal-content">
        <div class="modal-icon">🏆</div>
        <div class="modal-title">全員ゴール！</div>
        <div class="modal-message">結果を確認しましょう！</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;">
          <button class="btn btn-primary" onclick="goToResult()">結果を見る</button>
        </div>
      </div>
    </div>

    <!-- ダイスモーダル -->
    <div class="modal" id="diceModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="diceModalTitle">
      <div class="modal-content dice-modal-content" tabindex="-1">
        <h2 id="diceModalTitle" style="text-align:center;font-size:2rem;margin-bottom:20px;color:#333;">何が出るかな？</h2>
        <div class="dice-container">
          <div class="dice" id="dice">
            <div class="dice-face face-1"><div class="dot"></div></div>
            <div class="dice-face face-2"><div class="dot"></div><div class="dot"></div></div>
            <div class="dice-face face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="dice-face face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="dice-face face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="dice-face face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="dice-section">
      <button class="btn btn-primary" id="rollBtn" type="button">サイコロを振る</button>
    </div>

    <!-- ホームに戻るボタン -->
    <div class="button-container" style="text-align:center;margin:40px 0;padding-bottom:100px;">
      <button class="choice-button" onclick="location.href='index.html'">ホームへ戻る</button>
    </div>

    <footer></footer>

    <!-- 多人数管理スクリプト（sugoroku_origin_scriptより前に読み込む） -->
    <script src="js/sugoroku_members_script.js"></script>
    <script src="js/background_move.js"></script>
  </body>
</html>
